name: Build ImmortalWrt for Cudy TR3000

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 * *'

concurrency:
  group: build-tr3000
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: config/tr3000.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Init environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          # ★ 关键:创建并 chown /workdir,否则 ccache / git clone 都失败
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache dl/ and ccache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-${{ hashFiles(env.CONFIG_FILE) }}
          restore-keys: |
            ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z
          mkdir -p "$CCACHE_DIR"

      - name: Load config + diy-part1
        working-directory: /workdir/openwrt
        run: |
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & install feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2 + defconfig
        working-directory: /workdir/openwrt
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig 2>&1 | tee defconfig.log | tail -20

          echo
          echo "==== sanity: target/device ===="
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y' .config \
            || (echo "ERROR: cudy_tr3000-v1-ubootmod NOT enabled"; exit 1)

          echo "==== usb tethering modules ===="
          grep -E '^CONFIG_PACKAGE_kmod-(usb|ncm|mii|nls)' .config | sort

          echo "==== ttyd ===="
          grep -E 'ttyd' .config | sort

      - name: Download all sources
        working-directory: /workdir/openwrt
        run: make -j"$(nproc)" download

      - name: Build (ccache)
        working-directory: /workdir/openwrt
        env:
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
        run: |
          if ! make -j"$(nproc)" CC="ccache gcc" CXX="ccache g++"; then
            echo "::warning::Multi-threaded build failed, retrying single-threaded"
            make -j1 V=s 2>&1 | tee build.log
            tail -80 build.log
            exit 1
          fi
          ccache -s

      - name: Collect firmware + logs
        if: always()
        working-directory: /workdir/openwrt
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          OUTDIR=$(find bin/targets/mediatek -mindepth 1 -maxdepth 1 -type d | head -1)
          if [ -n "$OUTDIR" ] && [ -d "$OUTDIR" ]; then
            echo "==== output: $OUTDIR ===="
            ls -lh "$OUTDIR"
            cp -av "$OUTDIR"/*.bin $GITHUB_WORKSPACE/artifacts/ 2>/dev/null \
              || cp -av "$OUTDIR"/cudy_tr3000-v1-* $GITHUB_WORKSPACE/artifacts/ 2>/dev/null \
              || cp -av "$OUTDIR"/* $GITHUB_WORKSPACE/artifacts/
            ( cd $GITHUB_WORKSPACE/artifacts && sha256sum * > SHA256SUMS 2>/dev/null ) || true
          else
            echo "==== NO output dir ===="
            find bin -maxdepth 3 -type d 2>/dev/null
          fi
          cp -a build.log defconfig.log $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lhR $GITHUB_WORKSPACE/artifacts/

      - name: Upload firmware (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3000-firmware
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: hashFiles('artifacts/*.bin') != ''
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          RELEASE_TAG="ImmortalWrt-${BUILD_TIME}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release_body.md << EOF
          ## 📦 ImmortalWrt Firmware Release

          **🏷️ Tag:** $RELEASE_TAG
          **🌿 Branch:** $REPO_BRANCH
          **📱 Device:** Cudy TR3000 v1 (ubootmod, 128M NAND)
          **📅 Build Date:** $(date +"%Y-%m-%d %H:%M:%S")
          **🔧 Stack:** USB tethering + ttyd + luci-app-ttyd + luci-theme-argon

          ## 📥 Download

          Download the firmware file from the assets below, then flash via LuCI:

          1. LuCI → System → Backup / Flash Firmware → Flash image
          2. Choose \`*cudy_tr3000-v1-ubootmod-squashfs-sysupgrade.bin\`
          3. **Uncheck** "Keep settings" (factory .bin is a clean install)
          4. Flash → wait ~3 min → reboot

          ---

          Built with ❤️ using GitHub Actions
          EOF

      - name: Upload to Release
        if: hashFiles('artifacts/*.bin') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release_body.md
          fail_on_unmatched_files: false
          files: |
            artifacts/*.bin
            artifacts/SHA256SUMS
