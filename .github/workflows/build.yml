name: Build ImmortalWrt for Cudy TR3000

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 02:00 (UTC) 自动跑一次,跟进 padavanonly/immortalwrt-mt798x-6.6 提交
    - cron: '0 2 1 * *'

concurrency:
  group: build-tr3000
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: config/tr3000.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  CCACHE_DIR: /tmp/ccache-unused
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/chromium /usr/local/share/powershell \
            /usr/local/julia* /usr/local/lib/node_modules /usr/share/swift \
            /opt/google-chrome /opt/msedge /opt/firefox 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*
          df -h / | tail -1

      - name: Init environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev libelf-dev file wget \
            ccache time lib32gcc-s1 lib32stdc++6 lib32z1 \
            xz-utils device-tree-compiler curl ca-certificates

      - name: Clone source
        run: |
          git clone -b "$REPO_BRANCH" --single-branch --filter=blob:none \
            "$REPO_URL" openwrt
          git -C openwrt log -1 --oneline
          echo "==== tools/zstd source version ===="
          git -C openwrt log -1 --oneline -- tools/zstd 2>/dev/null || true

      - name: Setup ccache (disabled)
        run: |
          echo "ccache disabled — GitHub runner has hardcoded /workdir/.ccache in OpenWrt Makefile"
          echo "Skip ccache to avoid permission denied errors"

      - name: Cache dl/ (downloaded package sources)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ env.REPO_BRANCH }}
          restore-keys: |
            dl-${{ runner.os }}-${{ env.REPO_BRANCH }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}

      - name: Load custom config + diy-part1
        working-directory: openwrt
        run: |
          cp -f "../$CONFIG_FILE" .config
          bash "../$DIY_P1_SH"

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2 + defconfig
        working-directory: openwrt
        run: |
          bash "../$DIY_P2_SH"
          make defconfig 2>&1 | tee defconfig.log | tail -20

          echo
          echo "==== sanity: target/device ===="
          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y' .config \
            || (echo "ERROR: cudy_tr3000-v1-ubootmod NOT enabled"; exit 1)

          echo "==== usb tethering modules ===="
          grep -E '^CONFIG_PACKAGE_kmod-(usb|ncm|mii|nls)' .config | sort

          echo "==== ttyd ===="
          grep -E 'ttyd' .config | sort

      - name: Download all sources
        working-directory: openwrt
        run: make -j"$(nproc)" download

      - name: Build
        working-directory: openwrt
        run: |
          # 不开 ccache:GitHub runner 每次都是新机器,ccache 缓存几乎不命中,
          # 且上游 Makefile 写死 /workdir/.ccache 路径导致 permission denied。
          # 用 V=1 显示完整命令,tee 保留完整日志
          unset CCACHE_DIR
          make -j"$(nproc)" V=1 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "==== BUILD FAILED (exit=$EXIT) — last 100 lines ===="
            tail -100 build.log
            echo
            echo "==== build.log size: $(wc -l < build.log) lines ===="
            exit 1
          fi

      - name: Collect firmware + logs
        if: always()
        working-directory: openwrt
        run: |
          set +e  # 防止 cp 失败中断整个 step
          mkdir -p ../artifacts
          OUTDIR=$(find bin/targets/mediatek -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
          echo "==== OUTDIR=[$OUTDIR] ===="
          if [ -n "$OUTDIR" ] && [ -d "$OUTDIR" ]; then
            echo "==== output dir contents ===="
            ls -lh "$OUTDIR" 2>&1 | head -20
            # ubootmod 变体只有 sysupgrade.bin,直接抓全部 .bin
            if compgen -G "$OUTDIR/*.bin" > /dev/null; then
              cp -av "$OUTDIR"/*.bin ../artifacts/
            fi
            if compgen -G "$OUTDIR/cudy_tr3000-v1-*" > /dev/null; then
              cp -av "$OUTDIR"/cudy_tr3000-v1-* ../artifacts/
            fi
            ( cd ../artifacts && sha256sum * > SHA256SUMS 2>/dev/null )
          else
            echo "==== NO output dir — build failed early ===="
            find bin -maxdepth 3 -type d 2>/dev/null
          fi
          # 不管成败,日志都保留以便排查
          echo "==== build.log preview (last 80 lines) ===="
          if [ -f build.log ]; then
            tail -80 build.log
            cp -a build.log ../artifacts/
          else
            echo "(no build.log found)"
          fi
          if [ -f defconfig.log ]; then
            cp -a defconfig.log ../artifacts/
          fi
          echo "==== final artifacts/ ===="
          ls -lhR ../artifacts/
          exit 0

      - name: Upload firmware (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3000-firmware
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
